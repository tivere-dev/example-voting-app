apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "voting-app.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "voting-app.labels" (dict "root" $ "component" "worker") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "voting-app.podSecurityContext" (dict "uid" 1654 "gid" 1654) | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "voting-app.appImage" (dict "root" $ "image" .Values.worker.image) | quote }}
          imagePullPolicy: {{ .Values.appImage.pullPolicy }}
          # No probes: the worker serves no port, and if its main loop fails
          # the process exits, which Kubernetes already detects and restarts.
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # .NET writes diagnostic files to /tmp; the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
