# CI pipeline for the Voting App capstone.
#
#   terraform ─ fmt + validate (no AWS account, nothing is created)
#   test ────── build with Compose, run the smoke test
#      └── build-scan (vote, result, worker in parallel)
#            build image → Trivy report → Trivy gate → save the scanned image
#            └── deploy-kind
#                  temporary kind cluster in the runner → load the scanned
#                  images → helm lint → helm install --wait → smoke test
#                  └── publish (pushes to main only)
#                        push the same scanned images to GHCR, tagged with
#                        the commit SHA
#
# Images are passed between jobs as artifacts, so the image that is deployed
# and published is exactly the one Trivy scanned. Nothing is published unless
# the scan gate and the Kubernetes deploy test both pass.
#
# The kind cluster exists only inside the GitHub runner and is deleted when the
# job ends. It is a test deployment, not a persistent or cloud environment.
#
# Third-party actions are pinned to full commit SHAs (the version is in the
# comment), because a tag can be moved to different code but a SHA cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default. Only the publish job asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Trivy's official image, pinned by digest. v0.75.0 (1 Oct 2026) is an
  # immutable release, includes the fix for GHSA-mcj4-mphf-j9ff, and is not
  # affected by the March 2026 supply-chain incident (GHSA-69fq-xp46-6x23).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false: download the AWS provider but set up no state storage.
      # No AWS credentials exist in this workflow, and none are needed.
      - name: Download providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  test:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run the smoke test
        run: scripts/smoke-test.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build-scan:
    name: Build and scan (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    env:
      LOCAL_IMAGE: voting-app-${{ matrix.service }}:${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Report: list every HIGH and CRITICAL finding, but never fail here.
      - name: Trivy report (HIGH and CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$LOCAL_IMAGE"

      # Gate: fail the job on any CRITICAL vulnerability that has a fix, or any
      # secret found in the image. Unfixed findings are excluded because no
      # update exists yet to remove them; they still appear in the report.
      - name: Trivy gate (CRITICAL with a fix available)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln,secret \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$LOCAL_IMAGE"

      # Only images that passed the gate reach this step.
      - name: Save the scanned image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker save "$LOCAL_IMAGE" -o "$RUNNER_TEMP/voting-app-${SERVICE}.tar"

      - name: Upload the scanned image for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/voting-app-${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1

  deploy-kind:
    name: Deploy to a temporary kind cluster
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NAMESPACE: voting-app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the scanned images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # Same Kubernetes version as the local Minikube cluster (1.37). The
      # action deletes the cluster again in its post-job step.
      - name: Create a kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1
          cluster_name: voting-app-ci
          wait: 120s

      - name: Load the scanned images into the cluster
        run: |
          for archive in "$RUNNER_TEMP"/images/*.tar; do
            kind load image-archive "$archive" --name voting-app-ci
          done

      - name: Lint the chart
        run: helm lint --strict helm/voting-app --set appImage.tag="$GITHUB_SHA"

      - name: Install the chart
        run: |
          helm install voting-app helm/voting-app \
            --namespace "$NAMESPACE" --create-namespace \
            --set appImage.tag="$GITHUB_SHA" \
            --wait --timeout 5m
          kubectl -n "$NAMESPACE" get pods

      - name: Run the smoke test against the cluster
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/vote 8082:8080 > /tmp/pf-vote.log 2>&1 &
          kubectl -n "$NAMESPACE" port-forward svc/result 8081:8080 > /tmp/pf-result.log 2>&1 &
          sleep 5
          PSQL="kubectl -n $NAMESPACE exec deploy/db -- psql -U postgres -tAc" scripts/smoke-test.sh

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all,pvc,events || true
          for d in vote result worker redis db; do
            echo "--- logs: $d"
            kubectl -n "$NAMESPACE" logs "deploy/$d" --tail=50 || true
          done

  publish:
    name: Publish to GHCR (${{ matrix.service }})
    needs: deploy-kind
    # Only on a push to main: never on pull requests or manual runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    env:
      LOCAL_IMAGE: voting-app-${{ matrix.service }}:${{ github.sha }}
    steps:
      - name: Download the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/images

      - name: Load the scanned image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker load -i "$RUNNER_TEMP/images/voting-app-${SERVICE}.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that was scanned and deployed, tagged with the
      # commit SHA.
      - name: Push image tagged with the commit SHA
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          remote="ghcr.io/${owner}/voting-app-${SERVICE}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$remote"
          docker push "$remote"
          echo "Pushed $remote" >> "$GITHUB_STEP_SUMMARY"
