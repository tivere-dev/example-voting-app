# CI pipeline for the Voting App capstone.
#
#   terraform ─ fmt + validate (no AWS account, nothing is created)
#   test ────── build with Compose, run the smoke test
#      └── build-scan-push (vote, result, worker in parallel)
#            build image → Trivy report → Trivy gate → push to GHCR (main only)
#
# The Helm deploy job is added in Stage 5, once the chart exists.
# Third-party actions are pinned to full commit SHAs (the version is in the
# comment), because a tag can be moved to different code but a SHA cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default. Only the job that pushes images
# asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Trivy's official image, pinned by digest. v0.75.0 (1 Oct 2026) is an
  # immutable release, includes the fix for GHSA-mcj4-mphf-j9ff, and is not
  # affected by the March 2026 supply-chain incident (GHSA-69fq-xp46-6x23).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false: download the AWS provider but set up no state storage.
      # No AWS credentials exist in this workflow, and none are needed.
      - name: Download providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  test:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run the smoke test
        run: scripts/smoke-test.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build-scan-push:
    name: Build, scan and push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io; only used on pushes to main
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    env:
      LOCAL_IMAGE: voting-app-${{ matrix.service }}:${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Report: list every HIGH and CRITICAL finding, but never fail here.
      - name: Trivy report (HIGH and CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$LOCAL_IMAGE"

      # Gate: fail the job on any CRITICAL vulnerability that has a fix, or any
      # secret found in the image. Unfixed findings are excluded because no
      # update exists yet to remove them; they still appear in the report.
      - name: Trivy gate (CRITICAL with a fix available)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln,secret \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$LOCAL_IMAGE"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that was scanned, tagged with the commit SHA.
      - name: Push image tagged with the commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          remote="ghcr.io/${owner}/voting-app-${SERVICE}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$remote"
          docker push "$remote"
          echo "Pushed $remote" >> "$GITHUB_STEP_SUMMARY"
