# version is now using "compose spec"
# v2 and v3 are now combined!
# docker-compose v1.27+ required

services:
  # vote and result run the same hardened images that CI builds. Their health
  # checks are defined in each Dockerfile, so they are not repeated here.
  vote:
    build: ./vote
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # host:container. Host 8080 is taken on the dev machine, so the default
      # is 8082. Override with VOTE_PORT=<port> in the shell or a .env file.
      # The app listens on 8080 inside the container (non-root friendly).
      - "${VOTE_PORT:-8082}:8080"
    networks:
      - front-tier
      - back-tier

  result:
    build: ./result
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RESULT_PORT:-8081}:8080"
    networks:
      - front-tier
      - back-tier

  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - back-tier

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

  # this service runs once to seed the database with votes
  # it won't run unless you specify the "seed" profile
  # docker compose --profile seed up -d
  seed:
    build: ./seed-data
    profiles: ["seed"]
    depends_on:
      vote:
        condition: service_healthy 
    networks:
      - front-tier
    restart: "no"

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
